name: Release Vulnerability Scan

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan latest release binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Download latest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scan
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'bbkt-linux-amd64' --dir scan

      - name: Scan binary
        run: |
          go version -m scan/bbkt-linux-amd64
          govulncheck -mode=binary scan/bbkt-linux-amd64
