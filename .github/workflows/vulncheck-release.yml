name: Release Vulnerability Scan

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan latest release binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Download latest release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scan
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'bbkt-linux-amd64' --dir scan

      - name: Scan binary
        run: |
          go version -m scan/bbkt-linux-amd64
          govulncheck -mode=binary scan/bbkt-linux-amd64
